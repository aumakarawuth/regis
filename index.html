<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A1D23">
  <title>Admin — ระบบรับสมัคร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { background: #1A1D23; }

    .admin-header {
      background: #1A1D23;
      color: #fff;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2D3139;
    }

    .admin-header h1 { font-size: 1rem; font-weight: 700; }
    .admin-header .admin-badge {
      background: var(--clr-accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--r-full);
      letter-spacing: 0.05em;
    }

    .admin-content {
      background: var(--clr-bg);
      min-height: calc(100vh - 57px);
      padding: 16px;
    }

    /* Login screen */
    .admin-login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .login-box h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .login-box p { font-size: 0.875rem; color: var(--clr-text-muted); margin-bottom: 24px; }

    /* Student row */
    .student-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--clr-border);
      cursor: pointer;
    }
    .student-row:last-child { border-bottom: none; }
    .student-avatar {
      width: 40px; height: 40px;
      background: var(--clr-primary-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.125rem;
      flex-shrink: 0;
    }
    .student-info { flex: 1; min-width: 0; }
    .student-name { font-weight: 600; font-size: 0.9375rem; }
    .student-meta { font-size: 0.75rem; color: var(--clr-text-muted); }
    .student-appno { font-size: 0.75rem; font-weight: 700; color: var(--clr-primary); }

    /* Detail modal */
    #detail-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 5000;
      display: flex;
      align-items: flex-end;
    }

    .modal-sheet {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-handle {
      width: 40px; height: 4px;
      background: var(--clr-border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .doc-verify-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--clr-border);
    }

    .doc-verify-row img {
      width: 60px; height: 45px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
    }

    .doc-verify-row .doc-info { flex: 1; }
    .doc-verify-row .doc-name { font-size: 0.875rem; font-weight: 600; }
  </style>
</head>
<body>

<div id="app">
  <!-- Loading -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <p>กำลังโหลด...</p>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Admin Login -->
  <div id="admin-login" class="admin-login">
    <div class="login-box">
      <h2>🔐 Admin Login</h2>
      <p>ระบบจัดการการรับสมัครนักเรียน</p>
      <div class="field-stack">
        <div class="form-group">
          <label class="form-label">รหัสผ่าน</label>
          <input class="form-control" id="admin-password" type="password" placeholder="กรอกรหัสผ่าน Admin">
        </div>
        <button id="btn-admin-login" class="btn btn-primary btn-full">เข้าสู่ระบบ</button>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" class="hidden">
    <header class="admin-header">
      <div>
        <h1>📊 Dashboard รับสมัคร</h1>
      </div>
      <span class="admin-badge">ADMIN</span>
    </header>

    <div class="admin-content">

      <!-- Stats Grid -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">ยอดสมัครทั้งหมด</div>
        </div>
        <div class="stat-card accent">
          <div class="stat-value" id="stat-today">—</div>
          <div class="stat-label">สมัครวันนี้</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-value" id="stat-pending">—</div>
          <div class="stat-label">รอตรวจสอบ</div>
        </div>
        <div class="stat-card info">
          <div class="stat-value" id="stat-verified">—</div>
          <div class="stat-label">ผ่านการตรวจ</div>
        </div>
      </div>

      <!-- Branch Stats -->
      <div class="card mt-4" id="branch-stats-card">
        <p class="section-title">ยอดสมัครแยกตามสาขา</p>
        <div id="branch-stats">
          <div style="text-align:center;padding:16px;color:var(--clr-text-muted)">กำลังโหลด...</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tab-list mt-4">
        <button class="tab-btn active" data-tab="all">ทั้งหมด</button>
        <button class="tab-btn" data-tab="pending">รอตรวจ</button>
        <button class="tab-btn" data-tab="verified">ผ่านแล้ว</button>
        <button class="tab-btn" data-tab="incomplete">เอกสารไม่ครบ</button>
      </div>

      <!-- Search -->
      <div class="search-bar mt-3">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="form-control" id="search-input" type="search"
          placeholder="ค้นหาชื่อ / เลขบัตร / เลขสมัคร" style="padding-left:40px">
      </div>

      <!-- Export -->
      <div style="display:flex;gap:8px;margin-top:12px">
        <button id="btn-export-csv" class="btn btn-outline btn-sm">📥 Export CSV</button>
        <button id="btn-refresh" class="btn btn-ghost btn-sm">🔄 รีเฟรช</button>
      </div>

      <!-- Student List -->
      <div class="card mt-3" style="padding:0;overflow:hidden">
        <div id="student-list" style="padding:0 16px">
          <div style="text-align:center;padding:24px;color:var(--clr-text-muted)">กำลังโหลด...</div>
        </div>
        <div id="pagination" style="padding:12px 16px;border-top:1px solid var(--clr-border);display:flex;gap:8px;justify-content:center"></div>
      </div>

    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="hidden">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="modal-content"></div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Admin.init();
});
</script>
</body>
</html>
